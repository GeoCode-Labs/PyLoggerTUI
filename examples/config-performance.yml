# Exemplo de configuração com otimizações de performance
# Para arquivos grandes, use essas opções para evitar travamentos

# Formato do log - ajuste para seu formato específico
format: "{time} | {level} | {module}:{function}:{line} - {message}"

# Formato de data (opcional)
date_format: "%Y-%m-%d %H:%M:%S.%f"

# === OPÇÕES DE PERFORMANCE ===

# Limite máximo de linhas a carregar (evita travamentos em arquivos gigantes)
# Exemplos:
# - 50000 = carrega apenas as primeiras 50 mil linhas
# - null ou comentado = sem limite (carrega tudo)
max_lines: 100000

# Tamanho do chunk para lazy loading (padrão: 10000)
# Quanto menor, menos memória usa, mas mais lento
# Quanto maior, mais rápido, mas usa mais memória
chunk_size: 10000

# Amostragem inteligente para arquivos MUITO grandes (>500MB)
# true = pega apenas uma amostra de linhas (ex: 1 a cada 10)
# false = carrega tudo (respeitando max_lines)
# RECOMENDADO: true para arquivos > 1GB
smart_sample: true

# DICAS DE PERFORMANCE:
#
# 1. Para arquivos 100MB - 500MB:
#    - Use max_lines: 100000 ou menor
#    - smart_sample: false (carrega linhas completas)
#
# 2. Para arquivos 500MB - 2GB:
#    - Use max_lines: 100000
#    - smart_sample: true (carrega amostra inteligente)
#
# 3. Para arquivos > 2GB:
#    - max_lines: 50000
#    - smart_sample: true
#    - OU use: tail -n 100000 arquivo.log > recente.log
#
# 4. Para muitos arquivos:
#    - Abra apenas alguns de cada vez (não a pasta inteira)
#    - Use o TUI em arquivos individuais
#
# IMPORTANTE:
# - O TUI agora mostra uma tela de loading enquanto carrega
# - Arquivos são carregados em background (não trava a interface)
# - Para arquivos MUITO pesados, sempre use smart_sample: true
